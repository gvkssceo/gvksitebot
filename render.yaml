services:
  - type: web
    name: gvkss-bot-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.12"
      # Set in Render Dashboard → Environment. Prefer EmailJS or Resend (SMTP blocked on free tier).
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_APPLICATION
        sync: false
      - key: EMAILJS_TEMPLATE_CONFIRMATION
        sync: false
      - key: EMAILJS_USER_ID
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
